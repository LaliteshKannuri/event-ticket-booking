services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ticketbooking
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticketbooking"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ticketbooking
      DB_USER: ticket
      DB_PASSWORD: ticket
    ports:
      - "8080:8080"

volumes:
  pgdata:
